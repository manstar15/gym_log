<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#E4E5E1; --surface:#F5F5F2; --ink:#1E2124; --muted:#666B70; --line:#C9CBC5;
  --push:#C8322D; --pull:#2456A6; --legs:#D9A514; --core:#2E8B57; --empty:#D4D6D0;
  --up:#2E8B57; --down:#C8322D;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17191B; --surface:#212427; --ink:#ECEDEA; --muted:#9BA0A4; --line:#34383C;
    --push:#E0504A; --pull:#4A7FD6; --legs:#E8B935; --core:#3FAE6E; --empty:#2C3034;
    --up:#4CC07F; --down:#E8635D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17191B; --surface:#212427; --ink:#ECEDEA; --muted:#9BA0A4; --line:#34383C;
  --push:#E0504A; --pull:#4A7FD6; --legs:#E8B935; --core:#3FAE6E; --empty:#2C3034;
  --up:#4CC07F; --down:#E8635D;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,.big,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
h1{font-size:2.6rem;font-weight:800;margin:4px 0 18px;letter-spacing:.01em;line-height:1}
h2{font-size:1.4rem;font-weight:600;margin:0 0 12px}
section{background:var(--surface);border-radius:14px;padding:18px;margin-bottom:16px}
label.field{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
input[type=date],.inp{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;margin-bottom:14px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.type{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:1.5rem;padding:18px 0;border-radius:50px;border:3px solid var(--c);background:transparent;color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
.type[aria-pressed="true"]{background:var(--c);color:#fff}
.type[data-t="legs"][aria-pressed="true"]{color:#1E2124}
.type.extra{width:100%;font-size:1.2rem;padding:12px 0;margin-bottom:8px}
.hint{font-size:.88rem;color:var(--muted);margin:0 0 14px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px;width:100%;background:var(--ink);color:var(--bg);cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.toast{min-height:1.4em;font-size:.9rem;color:var(--muted);margin-top:8px}
.undo{font:inherit;font-weight:600;background:transparent;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:4px}
button:focus-visible,input:focus-visible{outline:3px solid var(--pull);outline-offset:2px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:10px;padding:4px;margin-bottom:14px}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:7px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.nav button{font:inherit;font-size:1.3rem;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.period{font-weight:600;text-align:center}
.total{display:flex;align-items:baseline;gap:10px;margin:8px 0 14px}
.big{font-size:4.5rem;font-weight:800;line-height:.9}
.total span:last-child{color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{text-align:center;font-size:.8rem;color:var(--muted)}
.bar{height:70px;border-radius:8px;background:var(--empty);display:flex;flex-direction:column;overflow:hidden;margin-top:4px}
.bar i{flex:1}
.day.today b{color:var(--ink)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .dow{font-size:.75rem;color:var(--muted);text-align:center}
.cell{aspect-ratio:1;border-radius:6px;background:var(--empty);display:flex;flex-direction:column;overflow:hidden;position:relative}
.cell i{flex:1}
.cell em{position:absolute;top:2px;left:4px;font-style:normal;font-size:.7rem;color:var(--muted)}
.cell.on em{color:#fff;text-shadow:0 0 2px rgba(0,0,0,.6)}
.cell.blank{background:transparent}
.year{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px}
.ycol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.ycol .stack{display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden;min-height:2px;background:var(--empty)}
.ycol small{font-size:.65rem;color:var(--muted);margin-top:4px}
.ycol .n{font-size:.75rem;font-weight:600;margin-bottom:2px}
.split{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:.95rem}
.split div{display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .tags{display:flex;gap:6px}
.tag{font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:20px;background:var(--c);color:#fff}
.tag.legs{color:#1E2124}
.del{font:inherit;font-size:.85rem;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px}
.del.sure{color:#fff;background:var(--down);border-radius:6px;font-weight:600}
.empty{color:var(--muted);margin:0}

/* weights */
.group{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.group:first-of-type{margin-top:0}
.group h2{margin:0}
.group span{color:var(--muted);font-size:.9rem}
.ex{background:var(--surface);border-radius:14px;padding:12px;margin-bottom:10px}
.open{all:unset;display:flex;align-items:center;gap:12px;width:100%;cursor:pointer;border-radius:10px}
.open:focus-visible{outline:3px solid var(--pull);outline-offset:2px}
.tile{width:56px;height:56px;border-radius:14px;flex:none;color:var(--ink);background:color-mix(in srgb,var(--c) 24%,var(--surface));display:grid;place-items:center}
.tile svg{width:44px;height:44px}
.tile.lg{width:84px;height:84px;border-radius:20px}
.tile.lg svg{width:66px;height:66px}
.exname{font-weight:600;line-height:1.2}
.exsub{font-size:.85rem;color:var(--muted)}
.chev{margin-left:auto;color:var(--muted);font-size:1.4rem}
.ctl{display:flex;align-items:center;gap:8px;margin-top:12px}
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:12px;padding:4px}
.stepper button{font:inherit;font-size:1.5rem;font-weight:500;width:44px;height:44px;border:0;border-radius:9px;background:var(--surface);color:var(--ink);cursor:pointer;line-height:1}
.stepper button:active{transform:scale(.94)}
.val{display:flex;align-items:baseline;justify-content:center;width:88px}
.val input{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:1.7rem;width:56px;text-align:right;background:transparent;border:0;color:var(--ink);padding:0;-moz-appearance:textfield}
.val input::-webkit-outer-spin-button,.val input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.val small{color:var(--muted);margin-left:3px}
.save{font:inherit;font-weight:600;margin-left:auto;border:0;border-radius:10px;padding:0 16px;height:52px;background:var(--ink);color:var(--bg);cursor:pointer;visibility:hidden}
.save.show{visibility:visible}
.save.done{background:var(--up);color:#fff;visibility:visible}

.back{font:inherit;font-weight:600;background:transparent;border:0;color:var(--ink);padding:8px 0;margin-bottom:10px;cursor:pointer;font-size:1rem}
.dhead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.dhead h1{font-size:2rem;margin:0}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:12px}
.stats .big{font-size:3.4rem}
.stats p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.chg{font-weight:600}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:"Barlow",system-ui,sans-serif}
.tl li{position:relative;padding-left:22px}
.tl li::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:var(--line)}
.tl li::after{content:"";position:absolute;left:0;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--c)}
.tl li:first-child::before{top:50%} .tl li:last-child::before{bottom:50%}
.tl .kg{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:1.4rem;margin-right:8px}
.chip{font-size:.8rem;font-weight:600;padding:1px 8px;border-radius:20px}
.chip.up{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.chip.down{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.chip.same{background:var(--bg);color:var(--muted)}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;z-index:5}
.tabbar div{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:560px}
.tabbar button{font:inherit;font-size:.8rem;font-weight:600;background:transparent;border:0;color:var(--muted);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar svg{width:26px;height:26px}
[hidden]{display:none!important}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;resize:vertical}
.login{position:fixed;inset:0;background:var(--bg);z-index:10;display:grid;place-items:center;padding:16px}
.login section{width:100%;max-width:400px}
.login .err{color:var(--down)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <!-- SESSIONS -->
  <div id="tab-sessions">
    <h1>Gym log</h1>
    <section aria-labelledby="logh">
      <h2 id="logh">Log a session</h2>
      <label class="field" for="date">Date</label>
      <input type="date" id="date">
      <div class="types" role="group" aria-label="What you trained">
        <button class="type" data-t="push" style="--c:var(--push)" aria-pressed="false">Push</button>
        <button class="type" data-t="pull" style="--c:var(--pull)" aria-pressed="false">Pull</button>
        <button class="type" data-t="legs" style="--c:var(--legs)" aria-pressed="false">Legs</button>
      </div>
      <button class="type extra" data-t="core" style="--c:var(--core)" aria-pressed="false">+ Core</button>
      <p class="hint">Pick everything you trained. Add core if you did it too.</p>
      <button class="btn" id="save" disabled>Log session</button>
      <div class="toast" id="toast" role="status"></div>
    </section>
    <section aria-label="Your sessions">
      <div class="seg" role="tablist">
        <button role="tab" data-v="week" aria-selected="true">Week</button>
        <button role="tab" data-v="month" aria-selected="false">Month</button>
        <button role="tab" data-v="year" aria-selected="false">Year</button>
      </div>
      <div class="nav">
        <button id="prev" aria-label="Previous">‹</button>
        <div class="period" id="period"></div>
        <button id="next" aria-label="Next">›</button>
      </div>
      <div class="total"><span class="big" id="count">0</span><span id="countLabel">sessions</span></div>
      <div id="chart"></div>
      <div class="split" id="split"></div>
    </section>
    <section aria-labelledby="histh">
      <h2 id="histh">Sessions</h2>
      <ul id="list"></ul>
    </section>
    <section aria-labelledby="datah">
      <h2 id="datah">Your data</h2>
      <p class="hint" id="syncStatus">Saved on this device only.</p>
      <div class="row2">
        <button class="btn ghost" id="exportBtn">Back up</button>
        <button class="btn ghost" id="importBtn">Restore</button>
      </div>
      <div id="dataBox" hidden>
        <textarea id="dataText" rows="5" aria-label="Backup text"></textarea>
        <p class="hint" id="dataHint"></p>
        <button class="btn" id="dataGo" hidden>Restore this backup</button>
      </div>
      <button class="btn ghost" id="logout">Connect to GitHub</button>
    </section>
  </div>

  <!-- WEIGHTS -->
  <div id="tab-weights" hidden>
    <h1>Weights</h1>
    <div id="exlist"></div>
  </div>

  <!-- EXERCISE DETAIL -->
  <div id="detail" hidden></div>
</main>

<div class="login" id="login" hidden>
  <section>
    <h1>Gym log</h1>
    <p class="hint">Paste your GitHub key to save everything to your gym_data repository. You only do this once on each device.</p>
    <label class="field" for="tok">GitHub key</label>
    <input class="inp" id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
    <button class="btn" id="loginBtn">Connect</button>
    <button class="btn ghost" id="skipBtn" style="margin-top:10px">Use without syncing</button>
    <div class="toast" id="loginMsg" role="status"></div>
  </section>
</div>

<nav class="tabbar" aria-label="Pages">
  <div role="tablist">
    <button role="tab" data-tab="sessions" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Sessions
    </button>
    <button role="tab" data-tab="weights" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12h10M4 8v8M7 6v12M17 6v12M20 8v8"/></svg>
      Weights
    </button>
  </div>
</nav>

<script>
/* ================= shared helpers ================= */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmt = d => `${DOW[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const kg = n => String(Math.round(n*100)/100);
function ago(s){
  const n = Math.round((parse(iso(new Date())) - parse(s)) / 864e5);
  if (n <= 0) return "today";
  if (n === 1) return "yesterday";
  if (n < 30) return `${n} days ago`;
  const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function store(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch(e){ return fallback; } }
function put(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

/* two-tap delete used everywhere */
function armDelete(btn, onConfirm){
  if (!btn.classList.contains("sure")){
    btn.classList.add("sure"); btn.textContent = "Tap again to delete";
    setTimeout(() => { if (btn.isConnected){ btn.classList.remove("sure"); btn.textContent = "Delete"; } }, 3000);
    return;
  }
  onConfirm();
}

/* ================= tabs ================= */
let tab = "sessions";
document.querySelectorAll(".tabbar button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
function showTab(t){
  tab = t; currentDetail = null;
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  document.getElementById("tab-sessions").hidden = t !== "sessions";
  document.getElementById("tab-weights").hidden = t !== "weights";
  document.getElementById("detail").hidden = true;
  if (t === "weights") renderExercises();
  window.scrollTo(0,0);
}

/* ================= sessions ================= */
const KEY = "gymlog.v1";
const TYPES = { push:"Push", pull:"Pull", legs:"Legs", core:"Core" };
const ORDER = ["push","pull","legs","core"];
let entries = store(KEY, []);
let view = "week", anchor = new Date(), picked = [];

function range(){
  if (view === "week"){ const s = weekStart(anchor); return [s, addDays(s,7)]; }
  if (view === "month") return [new Date(anchor.getFullYear(), anchor.getMonth(), 1), new Date(anchor.getFullYear(), anchor.getMonth()+1, 1)];
  return [new Date(anchor.getFullYear(),0,1), new Date(anchor.getFullYear()+1,0,1)];
}
function inRange(){ const [s,e] = range(); return entries.filter(x => { const d = parse(x.date); return d >= s && d < e; }); }
function byDate(list){ const m = {}; list.forEach(x => { (m[x.date] = m[x.date] || []).push(...x.types); }); return m; }
const stripes = types => types.map(t => `<i style="background:var(--${t})"></i>`).join("");

const dateInput = document.getElementById("date");
dateInput.value = iso(new Date());
document.querySelectorAll(".type").forEach(b => b.addEventListener("click", () => {
  const t = b.dataset.t;
  picked = picked.includes(t) ? picked.filter(x => x !== t) : [...picked, t];
  syncPicks();
}));
function syncPicks(){
  document.querySelectorAll(".type").forEach(b => b.setAttribute("aria-pressed", picked.includes(b.dataset.t)));
  document.getElementById("save").disabled = picked.length === 0 || !dateInput.value;
}
dateInput.addEventListener("change", syncPicks);
document.getElementById("save").addEventListener("click", () => {
  const types = [...picked].sort((a,b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  const id = Date.now().toString(36);
  entries.push({ id, date: dateInput.value, types });
  saveAll();
  const toast = document.getElementById("toast");
  toast.innerHTML = `Logged ${types.map(t => TYPES[t]).join(" + ")} on ${fmt(parse(dateInput.value))}. <button class="undo">Undo</button>`;
  toast.querySelector(".undo").addEventListener("click", () => {
    entries = entries.filter(x => x.id !== id); saveAll();
    toast.textContent = "Session removed."; render();
  });
  picked = []; syncPicks();
  anchor = parse(dateInput.value);
  render();
});
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.v;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-selected", x === b));
  render();
}));
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
function step(n){
  if (view === "week") anchor = addDays(anchor, 7*n);
  else if (view === "month") anchor = new Date(anchor.getFullYear(), anchor.getMonth()+n, 1);
  else anchor = new Date(anchor.getFullYear()+n, 0, 1);
  render();
}
function render(){
  const [s,e] = range(), list = inRange(), map = byDate(list), today = iso(new Date());
  let label;
  if (view === "week"){
    const end = addDays(s,6);
    label = weekStart(new Date()).getTime() === s.getTime() ? "This week" : `${s.getDate()} ${MONTHS[s.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
  } else if (view === "month") label = `${["January","February","March","April","May","June","July","August","September","October","November","December"][s.getMonth()]} ${s.getFullYear()}`;
  else label = String(s.getFullYear());
  document.getElementById("period").textContent = label;
  document.getElementById("next").disabled = e > new Date();
  document.getElementById("count").textContent = list.length;
  document.getElementById("countLabel").textContent = list.length === 1 ? "session" : "sessions";

  let html = "";
  if (view === "week"){
    html = `<div class="week">` + DOW.map((d,i) => { const day = iso(addDays(s,i));
      return `<div class="day${day===today?" today":""}"><b>${d}</b><div class="bar">${stripes(map[day]||[])}</div></div>`; }).join("") + `</div>`;
  } else if (view === "month"){
    const days = new Date(s.getFullYear(), s.getMonth()+1, 0).getDate(), offset = (s.getDay()+6)%7;
    html = `<div class="month">` + DOW.map(d => `<div class="dow">${d[0]}</div>`).join("");
    for (let i=0;i<offset;i++) html += `<div class="cell blank"></div>`;
    for (let d=1; d<=days; d++){ const t = map[iso(new Date(s.getFullYear(), s.getMonth(), d))]||[];
      html += `<div class="cell${t.length?" on":""}"><em>${d}</em>${stripes(t)}</div>`; }
    html += `</div>`;
  } else {
    const counts = MONTHS.map((_,m) => { const c = {push:0,pull:0,legs:0,core:0,n:0};
      list.forEach(x => { if (parse(x.date).getMonth() === m){ c.n++; x.types.forEach(t => c[t]++); } }); return c; });
    const max = Math.max(1, ...counts.map(c => c.n));
    html = `<div class="year">` + counts.map((c,m) => {
      const h = Math.round((c.n/max)*90), tot = c.push + c.pull + c.legs + c.core || 1;
      const segs = ORDER.map(t => c[t] ? `<i style="display:block;flex:${c[t]/tot};background:var(--${t})"></i>` : "").join("");
      return `<div class="ycol"><span class="n">${c.n||""}</span><div class="stack" style="height:${c.n?h:2}px">${segs}</div><small>${MONTHS[m][0]}</small></div>`;
    }).join("") + `</div>`;
  }
  document.getElementById("chart").innerHTML = html;

  const tally = {push:0,pull:0,legs:0,core:0};
  list.forEach(x => x.types.forEach(t => tally[t]++));
  document.getElementById("split").innerHTML = ORDER.map(t => `<div><span class="dot" style="--c:var(--${t})"></span>${TYPES[t]} ${tally[t]}</div>`).join("");

  const ul = document.getElementById("list");
  if (!list.length){ ul.innerHTML = `<p class="empty">Nothing logged in this ${view} yet.</p>`; return; }
  ul.innerHTML = [...list].sort((a,b) => b.date.localeCompare(a.date)).map(x =>
    `<li><div><div>${fmt(parse(x.date))}</div><div class="tags">${x.types.map(t => `<span class="tag ${t}" style="--c:var(--${t})">${TYPES[t]}</span>`).join("")}</div></div>
     <button class="del" data-id="${x.id}">Delete</button></li>`).join("");
  ul.querySelectorAll(".del").forEach(b => b.addEventListener("click", () => armDelete(b, () => {
    entries = entries.filter(x => x.id !== b.dataset.id); saveAll(); render();
  })));
}

  const b = ev.target.closest("[data-act]"); if (!b) return;
  const row = b.closest(".ex"), id = row.dataset.id, e = exById(id);
  const input = row.querySelector("input");
  const act = b.dataset.act;
  if (act === "open") return openDetail(id);
  if (act === "plus" || act === "minus"){
    const cur = parseFloat(input.value) || 0;
    const next = Math.max(0, Math.round((cur + (act === "plus" ? e.step : -e.step)) * 100) / 100);
    pending[id] = next; input.value = kg(next); refreshSave(row, id);
  }
  if (act === "save") saveWeight(id, row);
});
exlist.addEventListener("input", ev => {
  const row = ev.target.closest(".ex"); if (!row) return;
  const v = parseFloat(ev.target.value);
  pending[row.dataset.id] = isNaN(v) ? undefined : Math.max(0, v);
  refreshSave(row, row.dataset.id);
});
function saveWeight(id, row){
  const v = pending[id]; if (v === undefined) return;
  const today = iso(new Date());
  const list = lifts[id] || (lifts[id] = []);
  const same = list.find(x => x.date === today);
  if (same) same.kg = v; else list.push({ id: Date.now().toString(36), date: today, kg: v });
  saveAll();
  delete pending[id];
  row.querySelector(".exsub").textContent = subText(id);
  const btn = row.querySelector(".save");
  btn.textContent = "Saved ✓"; btn.classList.add("done");
  setTimeout(() => { if (btn.isConnected && btn.classList.contains("done")){ btn.classList.remove("done","show"); btn.textContent = "Save"; } }, 1500);
}

function lineChart(h, color){
  if (!h.length) return "";
  const W = 320, H = 160, L = 34, R = 12, T = 14, B = 24;
  const ts = h.map(x => parse(x.date).getTime());
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  let lo = Math.min(...h.map(x => x.kg)), hi = Math.max(...h.map(x => x.kg));
  if (lo === hi){ lo = Math.max(0, lo - 2); hi = hi + 2; }
  const X = t => t1 === t0 ? (L + (W-R)) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R);
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const pts = h.map((x,i) => [X(ts[i]), Y(x.kg)]);
  const line = pts.map((p,i) => `${i?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("");
  const area = `${line}L${pts[pts.length-1][0].toFixed(1)} ${H-B}L${pts[0][0].toFixed(1)} ${H-B}Z`;
  const d0 = parse(h[0].date), d1 = parse(h[h.length-1].date);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    <line x1="${L}" x2="${W-R}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${L}" x2="${W-R}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>
    <text x="${L-6}" y="${Y(hi)+3}" text-anchor="end">${kg(hi)}</text>
    <text x="${L-6}" y="${Y(lo)+3}" text-anchor="end">${kg(lo)}</text>
    ${h.length > 1 ? `<path d="${area}" fill="${color}" opacity=".12"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>` : ""}
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/>`).join("")}
    <text x="${L}" y="${H-6}">${d0.getDate()} ${MONTHS[d0.getMonth()]}</text>
    ${h.length > 1 ? `<text x="${W-R}" y="${H-6}" text-anchor="end">${d1.getDate()} ${MONTHS[d1.getMonth()]}</text>` : ""}
  </svg>`;
}
function openDetail(id){
  currentDetail = id;
  const e = exById(id), h = hist(id), el = document.getElementById("detail");
  const color = `var(--${e.g})`;
  let body;
  if (!h.length){
    body = `<section><p class="empty">No weights yet. Go back, set a weight with + and −, and tap Save. Every save shows up here.</p></section>`;
  } else {
    const first = h[0].kg, now = h[h.length-1].kg, diff = Math.round((now - first)*100)/100;
    const best = Math.max(...h.map(x => x.kg));
    const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
    const rows = h.map((x,i) => ({...x, d: i ? Math.round((x.kg - h[i-1].kg)*100)/100 : null})).reverse();
    body = `<section>
      <div class="stats">
        <div><div class="big">${kg(now)}<span style="font-size:1.4rem"> kg</span></div><p>Current</p></div>
        <div><div class="big chg ${cls}">${diff > 0 ? "+" : ""}${kg(diff)}</div><p>Since you started at ${kg(first)} kg</p></div>
      </div>
      <div class="chart">${lineChart(h, color)}</div>
      <p class="hint" style="margin:10px 0 0">Best ${kg(best)} kg, ${h.length} ${h.length === 1 ? "save" : "saves"}</p>
    </section>
    <section style="--c:${color}">
      <h2>Timeline</h2>
      <ul class="tl">${rows.map(x => `<li><div><span class="kg">${kg(x.kg)} kg</span>${
        x.d === null ? `<span class="chip same">Start</span>` : x.d > 0 ? `<span class="chip up">+${kg(x.d)}</span>` : x.d < 0 ? `<span class="chip down">${kg(x.d)}</span>` : `<span class="chip same">Same</span>`
      }<div class="exsub">${fmt(parse(x.date))} ${parse(x.date).getFullYear()}</div></div><button class="del" data-wid="${x.id}">Delete</button></li>`).join("")}</ul>
    </section>`;
  }
  el.innerHTML = `<button class="back" id="back">‹ Weights</button>
    <div class="dhead" style="--c:${color}"><span class="tile lg">${art(id)}</span><div><h1>${e.name}</h1><div class="exsub">${e.kind}</div></div></div>${body}`;
  el.querySelector("#back").addEventListener("click", () => showTab("weights"));
  el.querySelectorAll("[data-wid]").forEach(b => b.addEventListener("click", () => armDelete(b, () => {
    lifts[id] = (lifts[id] || []).filter(x => x.id !== b.dataset.wid); saveAll(); openDetail(id);
  })));
  document.getElementById("tab-weights").hidden = true;
  el.hidden = false;
  window.scrollTo(0,0);
}

/* ================= sync to GitHub ================= */
// Everything is saved to data.json in this repository:
const GH_OWNER = "manstar15";
const GH_REPO  = "gym_data";
const GH_FILE  = "data.json";
const TOKEN_KEY = "gymlog.ghkey";
const API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

let currentDetail = null, token = null, sha = null, saveTimer = null, busy = false;
const status = t => document.getElementById("syncStatus").textContent = t;
const now = () => new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
const enc = str => { const b = new TextEncoder().encode(str); let s = ""; b.forEach(c => s += String.fromCharCode(c)); return btoa(s); };
const dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,"")), c => c.charCodeAt(0)));

function rerender(){
  render();
  if (currentDetail) openDetail(currentDetail);
  else if (tab === "weights") renderExercises();
}
function merge(a, b){
  const E = new Map();
  [...(a.entries||[]), ...(b.entries||[])].forEach(x => E.set(x.id, x));
  const L = {};
  for (const src of [a.lifts||{}, b.lifts||{}]) for (const k in src){
    const m = new Map((L[k]||[]).map(x => [x.id, x]));
    src[k].forEach(x => m.set(x.id, x));
    L[k] = [...m.values()];
  }
  return { entries: [...E.values()], lifts: L };
}
async function gh(method, body){
  return fetch(API, {
    method, cache: "no-store",
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined
  });
}
// read data.json -> {data, sha} | {data:null} when file doesn't exist yet
async function readFile(){
  const r = await gh("GET");
  if (r.status === 404){
    // file missing, or repo missing / key can't see it
    const repo = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`, { headers: { Authorization: `Bearer ${token}` } });
    if (!repo.ok) throw { code: "repo" };
    return { data: null, sha: null };
  }
  if (r.status === 401 || r.status === 403) throw { code: "key" };
  if (!r.ok) throw { code: "net" };
  const j = await r.json();
  return { data: JSON.parse(dec(j.content)), sha: j.sha };
}
async function writeFile(){
  const r = await gh("PUT", { message: `Gym log update ${iso(new Date())}`, content: enc(JSON.stringify({ entries, lifts }, null, 1)), ...(sha ? { sha } : {}) });
  if (r.status === 409 || r.status === 422){
    // changed on another device since we last read it: combine both and try again
    const f = await readFile(); sha = f.sha;
    if (f.data){ const m = merge(f.data, { entries, lifts }); entries = m.entries; lifts = m.lifts; put(KEY, entries); put(LKEY, lifts); rerender(); }
    const r2 = await gh("PUT", { message: `Gym log update ${iso(new Date())}`, content: enc(JSON.stringify({ entries, lifts }, null, 1)), ...(sha ? { sha } : {}) });
    if (!r2.ok) throw { code: "net" };
    sha = (await r2.json()).content.sha; return;
  }
  if (r.status === 401 || r.status === 403) throw { code: "key" };
  if (!r.ok) throw { code: "net" };
  sha = (await r.json()).content.sha;
}
function fail(e){
  status(e && e.code === "key" ? "Your GitHub key stopped working. Tap Connect to GitHub and paste a new one."
       : "Couldn’t reach GitHub. Your changes are saved on this device and will sync next time.");
}
function saveAll(){
  put(KEY, entries); put(LKEY, lifts);
  if (!token) return;
  status("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 1200);
}
async function push(){
  if (busy){ saveTimer = setTimeout(push, 800); return; }
  busy = true;
  try { await writeFile(); status(`Saved to GitHub at ${now()}.`); }
  catch(e){ fail(e); }
  busy = false; saveTimer = null;
}
async function pull(first){
  if (busy) return;
  busy = true;
  try {
    const f = await readFile();
    sha = f.sha;
    const cloud = f.data || { entries: [], lifts: {} };
    const next = first ? merge(cloud, { entries, lifts }) : cloud;
    const changed = JSON.stringify(next) !== JSON.stringify(cloud);
    entries = next.entries || []; lifts = next.lifts || {};
    put(KEY, entries); put(LKEY, lifts);
    rerender();
    if (first && (changed || !f.data)) await writeFile();
    status(`Synced with GitHub at ${now()}.`);
  } catch(e){ busy = false; throw e; }
  busy = false;
}
function setConnected(on){
  document.getElementById("logout").textContent = on ? "Disconnect this device" : "Connect to GitHub";
  if (!on) status("Saved on this device only.");
}
async function connect(t, fromSetup){
  token = t;
  try {
    await pull(true);
    try { localStorage.setItem(TOKEN_KEY, t); } catch(e){}
    document.getElementById("login").hidden = true;
    setConnected(true);
  } catch(e){
    token = null;
    if (!fromSetup){ fail(e); return; }
    const msg = document.getElementById("loginMsg");
    msg.className = "toast err";
    msg.textContent = e.code === "key" ? "That key didn’t work. Copy it again from GitHub and paste the whole thing."
                    : e.code === "repo" ? `Can’t find the ${GH_REPO} repository. Check it exists and that the key has access to it.`
                    : "Couldn’t reach GitHub. Check your internet and try again.";
  }
}
function initSync(){
  let t = null; try { t = localStorage.getItem(TOKEN_KEY); } catch(e){}
  if (t) connect(t, false).then(() => { if (!token){ token = t; setConnected(true); } });
  else document.getElementById("login").hidden = false;
}
document.getElementById("loginBtn").addEventListener("click", () => {
  const t = document.getElementById("tok").value.trim();
  const msg = document.getElementById("loginMsg");
  if (!t){ msg.className = "toast err"; msg.textContent = "Paste your GitHub key first."; return; }
  msg.className = "toast"; msg.textContent = "Connecting…";
  connect(t, true);
});
document.getElementById("skipBtn").addEventListener("click", () => { document.getElementById("login").hidden = true; setConnected(false); });
document.getElementById("logout").addEventListener("click", () => {
  if (token){
    token = null; sha = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch(e){}
    setConnected(false);
  } else {
    document.getElementById("loginMsg").textContent = "";
    document.getElementById("login").hidden = false;
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && token && !saveTimer) pull(false).catch(fail);
});

// backup / restore
const box = document.getElementById("dataBox"), txt = document.getElementById("dataText"),
      hint = document.getElementById("dataHint"), go = document.getElementById("dataGo");
document.getElementById("exportBtn").addEventListener("click", async () => {
  box.hidden = false; go.hidden = true;
  txt.value = JSON.stringify({ entries, lifts });
  txt.focus(); txt.select();
  try { await navigator.clipboard.writeText(txt.value); hint.textContent = "Copied. Open your other site, tap Restore and paste it there."; }
  catch(e){ hint.textContent = "Select all of this text and copy it. Then open your other site, tap Restore and paste it there."; }
});
document.getElementById("importBtn").addEventListener("click", () => {
  box.hidden = false; go.hidden = false; txt.value = "";
  hint.textContent = "Paste your backup here. It adds to what’s already saved, nothing gets deleted.";
  txt.focus();
});
go.addEventListener("click", () => {
  let data;
  try { data = JSON.parse(txt.value); } catch(e){ hint.textContent = "That text isn’t a backup. Copy the whole thing from Back up and try again."; return; }
  if (!Array.isArray(data.entries) || typeof data.lifts !== "object"){ hint.textContent = "That text isn’t a backup. Copy the whole thing from Back up and try again."; return; }
  const next = merge({ entries, lifts }, data);
  entries = next.entries; lifts = next.lifts;
  saveAll(); rerender();
  hint.textContent = `Restored. You now have ${entries.length} sessions saved.`;
  go.hidden = true;
});

render();
initSync();
</script>
</body>
</html>
